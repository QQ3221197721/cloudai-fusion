version: '3.8'

services:
  apiserver:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgresql://postgres:password@db:5432/cloudai_fusion?sslmode=disable
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: debug
      API_PORT: 8080
      CLUSTER_ID: local-dev-cluster
    volumes:
      - ./config:/etc/cloudai-fusion:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - cloudai-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloudai_fusion
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../sql/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloudai-network

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloudai-network

  cafctl:
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: cloudai-cafctl
    user: "root"
    profiles:
      - tools
    depends_on:
      - apiserver

volumes:
  postgres_data:
  redis_data:

networks:
  cloudai-network:
    driver: bridge
