    get:
      summary: List recent SOC findings, newest first (security:read)
      tags: [soc]
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 100}}
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  findings: {type: array, items: {$ref: '#/components/schemas/SOCFinding'}}

  /api/v1/soc/playbooks:
    get:
      summary: List L8 SOAR playbooks (security:read)
      tags: [soc]
      responses:
        "200":
          description: Playbooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  playbooks:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        match_technique: {type: string}
                        min_severity: {type: string, enum: [low, medium, high, critical]}
                        actions: {type: array, items: {type: string}}
                        requires_approval: {type: boolean}

  /api/v1/soc/mitigations:
    get:
      summary: List active L8 mitigations applied by automated responses (security:read)
      description: |
        The observable effect of L8 SOAR responses: currently-active mitigations
        (e.g. blocked networks, isolated hosts) recorded by the response actuator.
        `actuator_real` reports whether a real enforcement backend is wired.
      tags: [soc]
      responses:
        "200":
          description: Active mitigations
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  actuator: {type: string}
                  actuator_real: {type: boolean}
                  mitigations:
                    type: array
                    items:
                      type: object
                      properties:
                        action: {type: string}
                        target: {type: string}
                        since: {type: string, format: date-time}

  /api/v1/soc/detect:
    post:
      summary: L3-L7 — run the Sigma detection engine over structured log events (security:manage)
      description: |
        Evaluates a batch of structured log events (a field→value map each) of the
        given Sigma logsource category against the loaded Sigma rule set, returning
        and storing a MITRE-mapped finding per rule match. `rules_total` reports how
        many rules are loaded (embedded + any operator-provided corpus).
      tags: [soc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, events]
              properties:
                category:
                  type: string
                  description: Sigma logsource category (e.g. process_creation, network_connection, dns_query, webserver)
                events:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        "200":
          description: Detection findings
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  rules_total: {type: integer}
                  findings:
                    type: array
                    items: {type: object}

  /api/v1/soc/analyze/endpoint:
    post:
      summary: L3 — analyze endpoint file hashes against L1 IOCs (security:manage)
      tags: [soc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host: {type: string}
                file_hashes: {type: array, items: {type: string}}
      responses:
        "200": {$ref: '#/components/responses/SOCFindings'}
        "400": {description: Invalid request}

  /api/v1/soc/analyze/network:
    post:
      summary: L4 — analyze connections (IPs/domains) against L1 IOCs (security:manage)
      tags: [soc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host: {type: string}
                ips: {type: array, items: {type: string}}
                domains: {type: array, items: {type: string}}
      responses:
        "200": {$ref: '#/components/responses/SOCFindings'}
        "400": {description: Invalid request}

  /api/v1/soc/analyze/workload:
    post:
      summary: L5 — CIS-style Kubernetes workload posture check (security:manage)
      tags: [soc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                namespace: {type: string}
                privileged: {type: boolean}
                host_network: {type: boolean}
                host_pid: {type: boolean}
                run_as_root: {type: boolean}
                allow_privilege_escalation: {type: boolean}
      responses:
        "200": {$ref: '#/components/responses/SOCFindings'}
        "400": {description: Invalid request}

  /api/v1/soc/analyze/identity:
    post:
      summary: L6 — detect brute-force and impossible-travel auth anomalies (security:manage)
      tags: [soc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      user: {type: string}
                      source_ip: {type: string}
                      country: {type: string}
                      success: {type: boolean}
                      timestamp: {type: string, format: date-time}
      responses:
        "200": {$ref: '#/components/responses/SOCFindings'}
        "400": {description: Invalid request}

  /api/v1/soc/analyze/image:
    post:
      summary: L7 — triage container-image CVEs (security:manage)
      tags: [soc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference: {type: string}
                cves:
                  type: array
                  items:
                    type: object
                    properties:
                      id: {type: string}
                      cvss: {type: number, format: float}
      responses:
        "200": {$ref: '#/components/responses/SOCFindings'}
        "400": {description: Invalid request}

  /api/v1/soc/findings/{id}/respond:
    post:
      summary: L8 — orchestrate a SOAR response for a finding (security:manage)
      tags: [soc]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Response verdict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SOCResponse'}
        "404": {description: Finding not found}

  /api/v1/soc/collect/endpoint:
    post:
      summary: L3 — run a real EDR collection and detect (security:manage)
      description: |
        Collects running-process executable hashes from the host via the EDR
        collector (real `/proc` on Linux, otherwise a simulated collector) and
        matches them against L1 IOCs. The response reports the collector's
        real-vs-simulated mode so the run is never a silent simulation.
      tags: [soc]
      responses:
        "200":
          description: Findings from collected endpoint telemetry
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  collector: {type: string, description: "e.g. proc-edr | static-edr"}
                  real: {type: boolean, description: "true when a real backend collected the telemetry"}
                  findings: {type: array, items: {$ref: '#/components/schemas/SOCFinding'}}
        "500": {description: Collection failed (e.g. /proc unavailable off-Linux)}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
      description: Unique tenant identifier

  responses:
    SOCFindings:
      description: Findings produced by a detection well
      content:
        application/json:
          schema:
            type: object
            properties:
              total: {type: integer}
              findings: {type: array, items: {$ref: '#/components/schemas/SOCFinding'}}

  schemas:
    Range:
      type: object
      description: An ephemeral red-team practice/eval range
      properties:
        id: {type: string}
        name: {type: string}
        kube_context: {type: string}
        endpoints: {type: array, items: {type: string}}
        apps: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
    SOCFinding:
      type: object
      description: A MITRE ATT&CK-mapped detection from an operations-layer well (L3-L8)
      properties:
        id: {type: string}
        well: {type: integer, description: "deep-well number (3-8)"}
        well_name: {type: string, description: "e.g. L4-network"}
        technique: {type: string, description: "MITRE ATT&CK technique, e.g. T1071"}
        tactic: {type: string, description: "MITRE ATT&CK tactic, e.g. TA0011"}
        severity: {type: string, enum: [low, medium, high, critical]}
        asset: {type: string}
        title: {type: string}
        evidence: {type: object, additionalProperties: true}
        detected_at: {type: string, format: date-time}
    SOCResponse:
      type: object
      description: An L8 SOAR orchestration verdict for a finding
      properties:
        id: {type: string}
        finding_id: {type: string}
        playbook: {type: string}
        executed: {type: boolean, description: "false when human approval is required"}
        created_at: {type: string, format: date-time}
        actions:
          type: array
          items:
            type: object
            properties:
              type: {type: string, enum: [isolate-host, block-network, quarantine-file, revoke-credential, rebuild-image, harden-workload, notify]}
              target: {type: string}
              automated: {type: boolean}
              detail: {type: string}

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        user:
          type: object

    ImportClusterRequest:
      type: object
      required: [name, provider, region, kubeconfig]
      properties:
        name:
          type: string
        provider:
          type: string
          enum: [aliyun, aws, azure, gcp, huawei, tencent]
        region:
          type: string
        kubeconfig:
          type: string
        labels:
          type: object

    Workload:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [training, inference, fine-tuning, batch, serving]
        cluster_id:
          type: string
        framework:
          type: string
          enum: [pytorch, tensorflow, jax]
        resource_request:
          type: object
          properties:
            gpu_count:
              type: integer
            gpu_type:
              type: string
            cpu_millicores:
              type: integer
            memory_bytes:
              type: integer

    SecurityPolicy:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [network, rbac, pod-security, compliance, secret, image]
        enforcement:
          type: string
          enum: [enforce, audit, warn]
        rules:
          type: array
          items:
            type: object

    # AI Engine Schemas
    SchedulingRequest:
      type: object
      required: [workload_id, workload_type, gpu_count]
      properties:
        workload_id:
          type: string
        workload_type:
          type: string
          enum: [training, inference, fine-tuning]
        gpu_count:
          type: integer
        gpu_type:
          type: string
        priority:
          type: integer
        available_nodes:
          type: array
          items:
            $ref: "#/components/schemas/ResourceMetrics"

    SchedulingDecision:
      type: object
      properties:
        workload_id:
          type: string
        recommended_node:
          type: string
        gpu_indices:
          type: array
          items:
            type: integer
        confidence:
          type: number
        estimated_cost_per_hour:
          type: number
        optimization_score:
          type: number
        reasoning:
          type: string
        llm_analysis:
          type: string
          nullable: true

    ResourceMetrics:
      type: object
      required: [node_name, cluster_id, gpu_utilization, gpu_memory_usage, cpu_utilization, memory_utilization]
      properties:
        node_name:
          type: string
        cluster_id:
          type: string
        gpu_utilization:
          type: number
        gpu_memory_usage:
          type: number
        cpu_utilization:
          type: number
        memory_utilization:
          type: number

    AnomalyDetectionRequest:
      type: object
      required: [cluster_id, metrics]
      properties:
        cluster_id:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ResourceMetrics"

    AnomalyResult:
      type: object
      properties:
        cluster_id:
          type: string
        anomalies:
          type: array
          items:
            type: object
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        analysis:
          type: string
        llm_threat_assessment:
          type: string
          nullable: true
        recommendations:
          type: array
          items:
            type: string

    CostAnalysisRequest:
      type: object
      required: [cluster_ids]
      properties:
        cluster_ids:
          type: array
          items:
            type: string
        period_days:
          type: integer
          default: 30

    CostAnalysisResult:
      type: object
      properties:
        total_cost:
          type: number
        cost_breakdown:
          type: object
        optimization_potential:
          type: number
        recommendations:
          type: array
          items:
            type: object
        projected_savings_monthly:
          type: number
        llm_analysis:
          type: string
          nullable: true

    AgentInsight:
      type: object
      properties:
        agent_type:
          type: string
          enum: [scheduler, security, cost, operations]
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        title:
          type: string
        description:
          type: string
        recommendation:
          type: string
        confidence:
          type: number

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        context:
          type: object

    ChatResponse:
      type: object
      properties:
        response:
          type: string
        agent_type:
          type: string
        confidence:
          type: number
        suggestions:
          type: array
          items:
            type: string
        llm_provider:
          type: string
          nullable: true

    # =========================================================================
    # Multi-Tenant Schemas
    # =========================================================================
    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        tier:
          type: string
          enum: [free, starter, pro, enterprise]
        status:
          type: string
          enum: [active, suspended, pending, deactivated]
        owner_id:
          type: string
        owner_email:
          type: string
          format: email
        quota:
          $ref: "#/components/schemas/ResourceQuota"
        network:
          $ref: "#/components/schemas/NetworkIsolation"
        billing:
          $ref: "#/components/schemas/BillingConfig"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTenantRequest:
      type: object
      required: [name, display_name, owner_id, owner_email, tier]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9-]+$"
        display_name:
          type: string
        owner_id:
          type: string
        owner_email:
          type: string
          format: email
        tier:
          type: string
          enum: [free, starter, pro, enterprise]

    ResourceQuota:
      type: object
      properties:
        max_cpu_millicores:
          type: integer
          format: int64
        max_memory_bytes:
          type: integer
          format: int64
        max_gpu_count:
          type: integer
        max_pods:
          type: integer
        max_services:
          type: integer
        max_namespaces:
          type: integer
        max_storage_bytes:
          type: integer
          format: int64

    QuotaUsage:
      type: object
      properties:
        tenant_id:
          type: string
        cpu_millicores:
          type: integer
          format: int64
        memory_bytes:
          type: integer
          format: int64
        gpu_count:
          type: integer
        pods:
          type: integer
        storage_bytes:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time

    NetworkIsolation:
      type: object
      properties:
        vpc_enabled:
          type: boolean
        vpc_id:
          type: string
        vpc_cidr:
          type: string
        enable_network_policy:
          type: boolean
        dns_zone:
          type: string

    BillingConfig:
      type: object
      properties:
        billing_email:
          type: string
          format: email
        payment_method:
          type: string
        currency:
          type: string
          default: USD
        budget_limit:
          type: number
        alert_threshold:
          type: number

    UsageRecord:
      type: object
      required: [resource_type, quantity]
      properties:
        resource_type:
          type: string
          enum: [cpu, memory, gpu, storage, network_egress]
        quantity:
          type: number
        namespace:
          type: string
        cluster_id:
          type: string

    BillingSummary:
      type: object
      properties:
        tenant_id:
          type: string
        period:
          type: string
        total_cost:
          type: number
        daily_costs:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              cost:
                type: number
        resource_breakdown:
          type: object
          additionalProperties:
            type: number

    Invoice:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        period:
          type: string
        total_amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [draft, sent, paid, overdue]
        line_items:
          type: array
          items:
            type: object
            properties:
              resource_type:
                type: string
              quantity:
                type: number
              unit_price:
                type: number
              total:
                type: number
        created_at:
          type: string
          format: date-time

    EncryptionKey:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        version:
          type: integer
        algorithm:
          type: string
        status:
          type: string
          enum: [active, rotated, revoked]
        created_at:
          type: string
          format: date-time

    # =========================================================================
    # Enterprise Schemas
    # =========================================================================
    SSOConfig:
      type: object
      required: [tenant_id, name, protocol]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        protocol:
          type: string
          enum: [saml, ldap, oidc]
        saml:
          type: object
          properties:
            entity_id:
              type: string
            sso_url:
              type: string
              format: uri
            certificate:
              type: string
            acs_url:
              type: string
              format: uri
        ldap:
          type: object
          properties:
            host:
              type: string
            port:
              type: integer
            base_dn:
              type: string
            user_filter:
              type: string
            use_tls:
              type: boolean
        role_mapping:
          type: object
          additionalProperties:
            type: string
        auto_provision:
          type: boolean
        enabled:
          type: boolean

    SSOLoginResult:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
        groups:
          type: array
          items:
            type: string
        token:
          type: string
        expires_at:
          type: string
          format: date-time

    AuditReport:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        report_type:
          type: string
          enum: [access, security, compliance, change, cost]
        status:
          type: string
          enum: [generating, completed, failed]
        period:
          type: object
          properties:
            start_time:
              type: string
              format: date-time
            end_time:
              type: string
              format: date-time
        summary:
          type: object
          properties:
            total_events:
              type: integer
            critical_findings:
              type: integer
            compliance_score:
              type: number
        generated_at:
          type: string
          format: date-time

    SLAContract:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        tier:
          type: string
          enum: [standard, business, premium, enterprise]
        availability_target:
          type: number
          example: 0.9999
        credit_policy:
          type: object
          properties:
            max_credit_percentage:
              type: number
            tiers:
              type: array
              items:
                type: object
                properties:
                  threshold:
                    type: number
                  credit_percentage:
                    type: number
        incident_response_times:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time

    SLAReport:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        period:
          type: string
        availability:
          type: number
        target:
          type: number
        is_met:
          type: boolean
        downtime_minutes:
          type: number
        incidents:
          type: integer
        credit_due:
          type: number
        created_at:
          type: string
          format: date-time

    # =========================================================================
    # Support Ticket Schemas
    # =========================================================================
    SupportTicket:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, assigned, in_progress, resolved, closed]
        category:
          type: string
          enum: [cluster, networking, billing, api, security, performance, other]
        assignee_id:
          type: string
        reporter_id:
          type: string
        comments:
          type: array
          items:
            $ref: "#/components/schemas/TicketComment"
        sla_deadline:
          type: string
          format: date-time
        sla_breached:
          type: boolean
        resolution:
          type: string
        satisfaction_rating:
          type: integer
          minimum: 1
          maximum: 5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTicketRequest:
      type: object
      required: [tenant_id, title, description, priority, reporter_id]
      properties:
        tenant_id:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [critical, high, medium, low]
        category:
          type: string
          enum: [cluster, networking, billing, api, security, performance, other]
        reporter_id:
          type: string

    TicketComment:
      type: object
      properties:
        id:
          type: string
        author_id:
          type: string
        content:
          type: string
        internal:
          type: boolean
        created_at:
          type: string
          format: date-time

    TicketMetrics:
      type: object
      properties:
        total_tickets:
          type: integer
        open_tickets:
          type: integer
        resolved_tickets:
          type: integer
        avg_first_response_hours:
          type: number
        avg_resolution_hours:
          type: number
        satisfaction_avg:
          type: number
        sla_compliance_rate:
          type: number
        by_priority:
          type: object
          additionalProperties:
            type: integer

    # =========================================================================
    # Original Schemas
    # =========================================================================
    IncidentRequest:
      type: object
      required: [incident_id, title, description]
      properties:
        incident_id:
          type: string
        title:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        category:
          type: string
          enum: [gpu_failure, node_pressure, pod_crash, oom, network, default]
        description:
          type: string
        affected_resources:
          type: array
          items:
            type: string
