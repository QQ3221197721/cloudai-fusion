      responses:
        "200": {description: Exportable bundle}

  /api/v1/evidence/checkpoint:
    get:
      summary: Signed tree head (STH)
      tags: [evidence]
      responses:
        "200": {description: Signed checkpoint}

  /api/v1/evidence/consistency:
    get:
      summary: Consistency proof between two tree sizes
      tags: [evidence]
      parameters:
        - {name: from, in: query, schema: {type: integer}}
