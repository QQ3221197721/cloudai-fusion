      responses:
        "200": {description: Rotated}

  /api/v1/redteam/engagements:
    get:
      summary: List red-team engagements
      tags: [redteam]
      parameters:
        - {name: tenant_id, in: query, schema: {type: string}}
      responses:
        "200": {description: Engagements}
    post:
      summary: Create a red-team engagement (signed scope; security:manage)
      tags: [redteam]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                tenant_id: {type: string}
                scope:
                  type: object
                  properties:
                    targets:
                      type: array
                      items:
                        type: object
                        properties:
                          kind: {type: string, enum: [cidr, host, url, cluster]}
                          value: {type: string}
                    allow_techniques: {type: array, items: {type: string}}
                    max_risk_tier: {type: integer, description: "0 read-only, 1 exploit, 2 lateral"}
                    approval_required_at: {type: integer}
      responses:
        "201": {description: Engagement created}
        "400": {description: Invalid or empty scope}

  /api/v1/redteam/engagements/{id}:
    get:
      summary: Get engagement status + findings
      tags: [redteam]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Engagement}
        "404": {description: Not found}

  /api/v1/redteam/engagements/{id}/abort:
    post:
      summary: Kill-switch - abort an engagement (security:manage)
      tags: [redteam]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Aborted}

  /api/v1/redteam/engagements/{id}/approve:
    post:
      summary: Approve a pending high-risk action (security:manage)
      tags: [redteam]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_id]
              properties:
                action_id: {type: string}
                risk_tier: {type: integer}
      responses:
        "200": {description: Approved}

  /api/v1/redteam/engagements/{id}/report:
    get:
      summary: Verifiable engagement report (embeds a signed STH)
      tags: [redteam]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Report}

  /api/v1/redteam/engagements/{id}/evidence:
    get:
      summary: Signed receipts for an engagement
      tags: [redteam]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Receipts}

  /api/v1/redteam/benchmark/cases:
    get:
      summary: List built-in CVE-Bench v2 cases (security:read)
      tags: [redteam]
      responses:
        "200":
          description: Benchmark case catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  cases:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        expect_technique: {type: string, description: "MITRE ATT&CK ID the case must solve"}
                        actions: {type: integer}

  /api/v1/redteam/benchmark:
    post:
      summary: Run the deterministic CVE-Bench v2 suite (security:manage)
      description: |
        Runs the built-in suite on isolated in-memory evidence chains and returns
        NUMERIC metrics (solve rate, scope violations that MUST be 0, and whether
        every receipt verified) plus per-case results.
      tags: [redteam]
      responses:
        "200":
          description: Benchmark metrics + per-case results
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: object
                    properties:
                      cases: {type: integer}
                      solved: {type: integer}
                      solve_rate: {type: number, format: float}
                      scope_violations: {type: integer}
                      all_verified: {type: boolean}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        case: {type: string}
                        solved: {type: boolean}
                        actions_run: {type: integer}
                        findings: {type: integer}
                        scope_violations: {type: integer}
                        receipts_verified: {type: boolean}
        "500": {description: Benchmark run failed}

  /api/v1/redteam/ranges:
    get:
      summary: List provisioned ephemeral ranges (security:read)
      tags: [redteam]
      responses:
        "200":
          description: Ranges
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  ranges: {type: array, items: {$ref: '#/components/schemas/Range'}}
    post:
      summary: Provision an ephemeral practice/eval range (security:manage)
      tags: [redteam]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                apps: {type: array, items: {type: string}, description: "logical app names (e.g. juice-shop)"}
                manifests: {type: array, items: {type: string}, description: "kubectl-appliable manifest paths/URLs"}
      responses:
        "201":
          description: Range provisioned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Range'}
        "500": {description: Provisioning failed}

  /api/v1/redteam/ranges/{id}:
    get:
      summary: Get a range by ID (security:read)
      tags: [redteam]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Range
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Range'}
        "404": {description: Not found}
    delete:
      summary: Tear down a range by ID (security:manage)
      tags: [redteam]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Torn down}
        "404": {description: Not found}

