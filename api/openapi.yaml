openapi: 3.1.0
info:
  title: CloudAI Fusion API
  description: |
    CloudAI Fusion - Cloud-Native AI Unified Management Platform API.
    Provides endpoints for multi-cloud cluster management, AI workload scheduling,
    security policy enforcement, monitoring & alerting, and cost optimization.
  version: 0.1.0-mvp
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: CloudAI Fusion Team
    url: https://github.com/cloudai-fusion/cloudai-fusion

servers:
  - url: http://localhost:8080
    description: Go API Server (clusters, auth, security, monitoring)
  - url: http://localhost:8090
    description: Python AI Engine (agents, LLM, chat, operations)
  - url: https://api.cloudai-fusion.io
    description: Production

security:
  - BearerAuth: []

tags:
  - name: auth
    description: Authentication & authorization
  - name: clusters
    description: Kubernetes cluster management
  - name: providers
    description: Cloud provider operations
  - name: workloads
    description: AI workload management
  - name: security
    description: Security policies & compliance
  - name: monitoring
    description: Monitoring & alerting
  - name: cost
    description: Cost management & optimization
  - name: mesh
    description: eBPF/Cilium/Istio Ambient service mesh
  - name: wasm
    description: WebAssembly container runtime
  - name: edge
    description: Edge-cloud collaborative architecture
  - name: agents
    description: AI agent operations (scheduling, security, cost)
  - name: chat
    description: Conversational AI operations assistant
  - name: operations
    description: Incident management & self-healing
  - name: insights
    description: AI-powered operational insights
  - name: tenants
    description: Multi-tenant isolation & billing
  - name: enterprise
    description: Enterprise features (SSO, SLA, audit)
  - name: tickets
    description: Support ticket management
  - name: evidence
    description: Verifiable Control Plane (signed, hash-chained receipts + Merkle log)
  - name: redteam
    description: Verifiable AI Red Team (authorized, evidence-grade security validation)
  - name: soc
    description: AISecOps Operations layer (L3-L8) — detection wells + SOAR response

paths:
  /healthz:
    get:
      summary: Health check
      tags: [system]
      security: []
      responses:
        "200":
          description: Service is healthy

  /api/v1/wells:
    get:
      summary: AISecOps deep-well readiness (honest per-well maturity)
      description: |
        Well-layer counterpart of /api/v1/capabilities. Publishes each deep well's
        machine-checked readiness: wired, backend_mode (real|simulated|none),
        fabric_connected, evidence_backed, and claimed_maturity (0..5). Values are
        reported by the composition root from facts; an overclaim fails the
        production boot (wellreadiness.Enforce).
      tags: [system]
      security: []
      responses:
        "200":
          description: Well-readiness snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_mode: {type: string}
                  total: {type: integer}
                  min_maturity: {type: integer}
                  max_maturity: {type: integer}
                  all_fabric_connected: {type: boolean}
                  wells:
                    type: array
                    items:
                      type: object
                      properties:
                        well: {type: integer}
                        name: {type: string}
                        claimed_maturity: {type: integer, description: "0 scaffold .. 5 production-hardened"}
                        wired: {type: boolean}
                        backend_mode: {type: string, enum: [real, simulated, none]}
                        fabric_connected: {type: boolean}
                        evidence_backed: {type: boolean}
                        detail: {type: string}
                        registered_at: {type: string, format: date-time}

  /api/v1/hunt:
    post:
      summary: L2 — run a threat-hunting correlation (security:manage)
      description: |
        Correlates recent CVEs and IOC hits from L1 into MITRE ATT&CK-mapped
        findings via the pluggable Reasoner (rule-based by default).
      tags: [soc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                since: {type: string, format: date-time}
                min_cvss: {type: number, format: float}
                ioc_type: {type: string}
                ioc_values: {type: array, items: {type: string}}
                limit: {type: integer}
      responses:
        "200":
          description: Hunt findings
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  findings: {type: array, items: {type: object}}
        "400": {description: Invalid query}

  /api/v1/hunt/behavior:
    post:
      summary: L2 — UEBA behavioral anomaly analysis (security:manage)
      description: |
        User & Entity Behavior Analytics. `train` observations warm the per-entity
        baseline (Welford mean/variance + categorical frequency) without producing
        findings; `observe` observations are scored for numeric deviation (Z-score)
        and categorical rarity/first-seen, yielding MITRE-mapped findings. Each
        observation is {entity, metrics{name:number}, categories{name:string}}.
      tags: [soc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observe]
              properties:
                name: {type: string}
                train:
                  type: array
                  items:
                    type: object
                    properties:
                      entity: {type: string}
                      metrics: {type: object, additionalProperties: {type: number}}
                      categories: {type: object, additionalProperties: {type: string}}
                observe:
                  type: array
                  items:
                    type: object
                    properties:
                      entity: {type: string}
                      metrics: {type: object, additionalProperties: {type: number}}
                      categories: {type: object, additionalProperties: {type: string}}
      responses:
        "200":
          description: Behavioral anomaly findings
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  findings: {type: array, items: {type: object}}
        "400": {description: Invalid request}

  /api/v1/intel/sync:
    post:
      summary: L1 — trigger an offline threat-intel feed synchronization (security:manage)
      tags: [soc]
      responses:
        "200":
          description: Sync result (partial result + error surfaced on partial failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      cve_added: {type: integer}
                      ioc_added: {type: integer}
                      errors: {type: array, items: {type: string}}
                  error: {type: string}

  /api/v1/intel/stix:
    post:
      summary: L1 — ingest a STIX 2.1 bundle pushed in the request body (security:manage)
      description: |
        Push-model threat-intel ingestion for STIX 2.1 (the OASIS standard exported
        by MISP, AlienVault OTX, and most TIPs). Indicators (ipv4/ipv6-addr,
        domain-name, url, email-addr, file:hashes.*), vulnerabilities (→ CVEs), and
        attack-patterns (→ MITRE techniques) are parsed and upserted into L1. Body
        is a raw STIX bundle JSON (max 16 MiB).
      tags: [soc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A STIX 2.1 bundle (type=bundle with an objects array)
      responses:
        "200":
          description: Sync result (partial result + error surfaced on partial failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      cve_added: {type: integer}
                      ioc_added: {type: integer}
                      errors: {type: array, items: {type: string}}
                  error: {type: string}

  /api/v1/auth/login:
    post:
      summary: User login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /api/v1/auth/register:
    post:
      summary: Register new user
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "201":
          description: User registered

  /api/v1/auth/refresh:
    post:
      summary: Refresh JWT token
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /api/v1/clusters:
    get:
      summary: List managed clusters
      tags: [clusters]
      responses:
        "200":
          description: List of clusters
    post:
      summary: Import a cluster
      tags: [clusters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportClusterRequest"
      responses:
        "201":
          description: Cluster imported

  /api/v1/clusters/{id}:
    get:
      summary: Get cluster details
      tags: [clusters]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cluster details

  /api/v1/clusters/{id}/health:
    get:
      summary: Get cluster health
      tags: [clusters]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cluster health status

  /api/v1/clusters/{id}/gpu-topology:
    get:
      summary: Get GPU topology for cluster
      tags: [clusters]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: GPU topology information

  /api/v1/providers:
    get:
      summary: List cloud providers
      tags: [providers]
      responses:
        "200":
          description: List of configured providers

  /api/v1/providers/{name}/gpu-instances:
    get:
      summary: List available GPU instances
      tags: [providers]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Available GPU instance types

  /api/v1/workloads:
    get:
      summary: List workloads
      tags: [workloads]
      responses:
        "200":
          description: List of workloads
    post:
      summary: Create workload
      tags: [workloads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Workload"
      responses:
        "201":
          description: Workload created

  /api/v1/security/policies:
    get:
      summary: List security policies
      tags: [security]
      responses:
        "200":
          description: List of security policies
    post:
      summary: Create security policy
      tags: [security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityPolicy"
      responses:
        "201":
          description: Policy created

  /api/v1/security/scan:
    post:
      summary: Run vulnerability scan
      tags: [security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster_id, scan_type]
              properties:
                cluster_id:
                  type: string
                scan_type:
                  type: string
                  enum: [image, config, runtime]
      responses:
        "202":
          description: Scan initiated

  /api/v1/security/compliance/{clusterId}/{framework}:
    get:
      summary: Get compliance report
      tags: [security]
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: framework
          in: path
          required: true
          schema:
            type: string
            enum: [CIS, NIST, SOC2, PCI-DSS, HIPAA]
      responses:
        "200":
          description: Compliance report

  /api/v1/monitoring/alerts/rules:
    get:
      summary: List alert rules
      tags: [monitoring]
      responses:
        "200":
          description: Alert rules

  /api/v1/cost/summary:
    get:
      summary: Get cost summary
      tags: [cost]
      parameters:
        - name: start
          in: query
          schema:
            type: string
        - name: end
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Cost summary

  /api/v1/cost/optimization:
    get:
      summary: Get cost optimization recommendations
      tags: [cost]
      responses:
        "200":
          description: Cost optimization recommendations

  # =========================================================================
  # Service Mesh Endpoints (eBPF / Cilium / Istio Ambient)
  # =========================================================================

  /api/v1/mesh/status:
    get:
      summary: Get service mesh status
      tags: [mesh]
      responses:
        "200":
          description: Mesh mode, mTLS state, connected services

  /api/v1/mesh/policies:
    get:
      summary: List mesh network policies
      tags: [mesh]
      responses:
        "200":
          description: List of L3/L4/L7 network policies
    post:
      summary: Create mesh network policy
      tags: [mesh]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                namespace:
                  type: string
                type:
                  type: string
                  enum: [network, traffic, authorization]
                action:
                  type: string
                  enum: [allow, deny, audit]
      responses:
        "201":
          description: Policy created

  /api/v1/mesh/traffic:
    get:
      summary: Get mesh traffic metrics
      tags: [mesh]
      parameters:
        - name: namespace
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Real-time traffic metrics

  # =========================================================================
  # WebAssembly Runtime Endpoints
  # =========================================================================

  /api/v1/wasm/modules:
    get:
      summary: List registered Wasm modules
      tags: [wasm]
      responses:
        "200":
          description: List of Wasm modules
    post:
      summary: Register a Wasm module
      tags: [wasm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, source, runtime]
              properties:
                name:
                  type: string
                source:
                  type: string
                runtime:
                  type: string
                  enum: [spin, wasmedge, wasmtime]
                memory_limit_mb:
                  type: integer
                environment:
                  type: object
      responses:
        "201":
          description: Module registered

  /api/v1/wasm/deploy:
    post:
      summary: Deploy Wasm function
      tags: [wasm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module_name, target_cluster]
              properties:
                module_name:
                  type: string
                target_cluster:
                  type: string
                replicas:
                  type: integer
                trigger:
                  type: string
                  enum: [http, event, cron]
      responses:
        "202":
          description: Deployment initiated

  /api/v1/wasm/instances:
    get:
      summary: List running Wasm instances
      tags: [wasm]
      responses:
        "200":
          description: List of Wasm instances

  /api/v1/wasm/metrics:
    get:
      summary: Get Wasm runtime metrics
      tags: [wasm]
      responses:
        "200":
          description: Performance metrics for Wasm functions

  # =========================================================================
  # Edge-Cloud Architecture Endpoints
  # =========================================================================

  /api/v1/edge/topology:
    get:
      summary: Get edge-cloud topology
      tags: [edge]
      responses:
        "200":
          description: Three-tier topology (Cloud/Edge/Terminal)

  /api/v1/edge/nodes:
    get:
      summary: List edge nodes
      tags: [edge]
      responses:
        "200":
          description: List of edge nodes
    post:
      summary: Register edge node
      tags: [edge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, region, endpoint]
              properties:
                name:
                  type: string
                region:
                  type: string
                capabilities:
                  type: array
                  items:
                    type: string
                max_power_watts:
                  type: integer
                endpoint:
                  type: string
      responses:
        "201":
          description: Edge node registered

  /api/v1/edge/deploy:
    post:
      summary: Deploy workload to edge
      tags: [edge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workload_id, target_nodes]
              properties:
                workload_id:
                  type: string
                target_nodes:
                  type: array
                  items:
                    type: string
                model_size_params:
                  type: string
                sync_policy:
                  type: string
                  enum: [strong, eventual, manual]
      responses:
        "202":
          description: Edge deployment initiated

  /api/v1/edge/sync-policies:
    get:
      summary: Get edge sync policies
      tags: [edge]
      responses:
        "200":
          description: Data synchronization policies

  # =========================================================================
  # AI Engine Endpoints (port 8090)
  # =========================================================================

  /api/v1/scheduling/optimize:
    post:
      summary: AI-powered scheduling optimization with LLM reasoning
      tags: [agents]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulingRequest"
      responses:
        "200":
          description: Scheduling decision with confidence score and reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulingDecision"

  /api/v1/anomaly/detect:
    post:
      summary: Anomaly detection with LLM-enhanced threat analysis
      tags: [agents]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnomalyDetectionRequest"
      responses:
        "200":
          description: Anomaly detection result with severity and recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyResult"

  /api/v1/cost/analyze:
    post:
      summary: Cost analysis with LLM-generated optimization recommendations
      tags: [agents]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostAnalysisRequest"
      responses:
        "200":
          description: Cost analysis with breakdown and savings potential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostAnalysisResult"

  /api/v1/insights:
    get:
      summary: Generate dynamic AI-powered operational insights
      tags: [insights]
      security: []
      responses:
        "200":
          description: Array of insights across all agent domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentInsight"

  /api/v1/models/status:
    get:
      summary: Honest status of AI models and LLM backends
      tags: [agents]
      security: []
      responses:
        "200":
          description: Model status including LLM integration availability

  /api/v1/chat:
    post:
      summary: Interactive AI operations assistant powered by LLM
      tags: [chat]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: AI assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /api/v1/ops/incident:
    post:
      summary: LLM-powered incident root cause analysis and remediation
      tags: [operations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentRequest"
      responses:
        "200":
          description: Incident analysis with root cause and remediation script

  /api/v1/ops/scaling:
    post:
      summary: Predictive scaling recommendations
      tags: [operations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avg_gpu_utilization:
                  type: number
                avg_cpu_utilization:
                  type: number
                queue_depth:
                  type: integer
      responses:
        "200":
          description: Scaling recommendations with confidence

  # =========================================================================
  # Multi-Tenant Isolation Endpoints
  # =========================================================================

  /api/v1/tenants:
    get:
      summary: List all tenants
      tags: [tenants]
      parameters:
        - name: tier
          in: query
          schema:
            type: string
            enum: [free, starter, pro, enterprise]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, pending, deactivated]
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      summary: Create a new tenant
      tags: [tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /api/v1/tenants/{tenantId}:
    get:
      summary: Get tenant details
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    delete:
      summary: Delete a tenant
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "204":
          description: Tenant deleted

  /api/v1/tenants/{tenantId}/tier:
    put:
      summary: Update tenant tier
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier:
                  type: string
                  enum: [free, starter, pro, enterprise]
      responses:
        "200":
          description: Tier updated

  /api/v1/tenants/{tenantId}/suspend:
    post:
      summary: Suspend a tenant
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Tenant suspended

  /api/v1/tenants/{tenantId}/reactivate:
    post:
      summary: Reactivate a suspended tenant
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant reactivated

  /api/v1/tenants/{tenantId}/quota:
    get:
      summary: Get tenant quota usage
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Quota usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaUsage"

  /api/v1/tenants/{tenantId}/quota/check:
    post:
      summary: Check if a resource request fits within quota
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, amount]
              properties:
                resource_type:
                  type: string
                  enum: [cpu, memory, gpu, storage, pods]
                amount:
                  type: number
      responses:
        "200":
          description: Quota check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  reason:
                    type: string

  /api/v1/tenants/{tenantId}/billing/usage:
    post:
      summary: Record usage for billing
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
