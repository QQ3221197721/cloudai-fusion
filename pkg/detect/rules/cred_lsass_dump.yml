title: LSASS Credential Dumping via Known Tooling
id: 3f9c1d2e-7a4b-4c85-9e13-2b6f8d0a4c71
status: stable
description: Detects credential harvesting from LSASS memory, either via a dumping utility invoked against lsass or via the comsvcs.dll MiniDump living-off-the-land technique. Matches the ACCESSING process, not lsass itself.
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
      - '\dumpert.exe'
      - '\nanodump.exe'
  selection_tool_target:
    CommandLine|contains: 'lsass'
  selection_comsvcs:
    CommandLine|contains:
      - 'comsvcs.dll,MiniDump'
      - 'comsvcs.dll MiniDump'
  condition: (selection_tool and selection_tool_target) or selection_comsvcs
