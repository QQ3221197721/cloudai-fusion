# ============================================================================
# CloudAI Fusion - AI Engine pytest Configuration
# ============================================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Testing options with verbose output and coverage
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=. 
    --cov-report=term-missing 
    --cov-report=html:coverage_reports/html

# Async mode configuration (critical for M29/M31 security tests)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require external services
    gpu: marks tests that require GPU
    asyncio: marks tests using asyncio

# Logging
log_cli = true
log_cli_level = WARNING
