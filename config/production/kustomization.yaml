apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production environment configuration for CloudAI Fusion
# High-availability and performance-optimized settings

namespace: cloudai-fusion-production

resources:
  - ../base

nameSuffix: -production

commonLabels:
  environment: production
  managed-by: github-actions
  tier: frontend

patchesStrategicMerge:
  # Production HA settings
  - deployment-production-patch.yaml
  
  # Optimized resource limits
  - deployment-resources-production-patch.yaml
  
  # Production networking
  - service-production-patch.yaml

configMapPatch:
  data:
    DRIFT_THRESHOLD: "0.25"
    RATE_LIMIT_RPM: "500"
    CANARY_TRAFFIC_PERCENT: "10"
    ENABLE_TRACING: "true"
    ENVIRONMENT_NAME: "production"
    LOG_LEVEL: "info"

configMapGenerator:
  - name: cloudai-fusion-config-production
    literals:
      - METRICS_ENABLED=true
      - HEALTH_CHECK_INTERVAL=10
      - AUTO_SCALING_ENABLED=true
      - BACKUP_ENABLED=true
      - MAINTENANCE_MODE=false

secretGenerator:
  - name: cloudai-fusion-secrets-production
    envs:
      - secrets-production.env

images:
  - name: ghcr.io/cloudai-fusion/cloudai-fusion
    newTag: ${DEPLOYMENT_TAG:-latest}

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
